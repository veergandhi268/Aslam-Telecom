<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(6, 6)">
    <!-- Rounded Hex / Shield Base -->
    <rect x="0" y="0" width="58" height="58" rx="16" fill="url(#primaryGrad)" />
    <!-- Inner Phone & Chip Geometry -->
    <rect x="14" y="9" width="30" height="40" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <!-- Screen Notch/Speaker -->
    <line x1="25" y1="13" x2="33" y2="13" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
    <!-- Center Precision Repair Pulse / Wrench Sparkle -->
    <path d="M29 20 L29 34 M22 27 L36 27" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="29" cy="27" r="3.2" fill="#ffffff" />
    <!-- Circuit Dots -->
    <circle cx="19" cy="18" r="1.5" fill="#38bdf8" />
    <circle cx="39" cy="36" r="1.5" fill="#38bdf8" />
    <!-- Home Bar -->
    <line x1="24" y1="44" x2="34" y2="44" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
    <!-- Little wrench/gear accent -->
    <circle cx="48" cy="12" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
    <path d="M46 10 L50 14 M50 10 L46 14" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Business Name Typography -->
  <text x="76" y="35" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5" fill="#0f172a">
    ASLAM <tspan fill="#0284c7">TELECOM</tspan>
  </text>

  <!-- Subtitle / Tagline -->
  <text x="77" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" letter-spacing="1.8" fill="#64748b">
    REPAIR • REUSE • REVIVE
  </text>
  <text x="238" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" letter-spacing="0.5" fill="#0284c7">
    | BORIVALI
  </text>
</svg>
